name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Make the Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: upsolve-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  backend:
    name: Backend and lessons
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - run: pip install -r requirements-dev.txt

      - name: Check lesson files
        run: python -m app.content

      - name: API tests
        run: pytest -q

  templates:
    name: Template generator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Compile Template.java on its own
        # It must stay free of Android imports so contributors can test it on a computer.
        run: |
          mkdir -p /tmp/out
          javac -nowarn -encoding UTF-8 -d /tmp/out \
            app/src/main/java/com/kun/cfdaily/data/Template.java tools/template-check/Run.java
