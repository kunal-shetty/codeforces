version: 2
updates:
  # Keeps the CI actions current. The app itself has no library dependencies.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    # Major Gradle and Android Gradle Plugin versions need a manual migration, so only minor and patch updates come in.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
