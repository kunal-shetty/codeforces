plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kun.cfdaily'
    compileSdk 36

    defaultConfig {
        applicationId "com.kun.cfdaily"
        minSdk 26
        targetSdk 34
        versionCode 7
        versionName "3.1"

        // Upsolve server for accounts and backup: upsolve.api in local.properties, or UPSOLVE_API_URL.
        // Empty means the app stays fully offline and hides the sign-in card.
        def local = new Properties()
        def localFile = rootProject.file("local.properties")
        if (localFile.exists()) localFile.withInputStream { local.load(it) }
        def api = local.getProperty("upsolve.api") ?: (System.getenv("UPSOLVE_API_URL") ?: "")
        buildConfigField "String", "API_URL", "\"${api}\""
    }

    buildFeatures {
        buildConfig true
    }

    // Lessons live in content/ at the repo root, shared with the backend.
    sourceSets {
        main {
            assets.srcDirs += ['../content']
        }
    }

    // Release signing comes from environment variables (set by the Release workflow from repository secrets),
    // so every published APK carries the same key and installs as an update. Never commit the keystore.
    def keystore = System.getenv("UPSOLVE_KEYSTORE")
    signingConfigs {
        if (keystore) {
            release {
                storeFile file(keystore)
                storePassword System.getenv("UPSOLVE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("UPSOLVE_KEY_ALIAS")
                keyPassword System.getenv("UPSOLVE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystore) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
